name: Release APK

# ChatNook's release build: the React client packaged with Capacitor. It keeps the
# native app's package id (com.chatnook.app) and signing key, so it installs as an
# update. release-apk.yml still builds the Compose prototype as a rollback artifact
# but no longer publishes releases.
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'web/**'
      - '.github/workflows/release-web-apk.yml'
  # No paths filter on push: a release tag must always produce an APK.
  push:
    branches: [main]
    tags: ['v*']

concurrency:
  group: web-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        working-directory: web
        run: npm ci

      - name: Typecheck, lint and build
        working-directory: web
        env:
          VITE_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          npm run lint
          npm run build

      # A fork's PR has no secrets and is only a compile check; anything that
      # could be handed to a friend must be bound to the real project.
      - name: Require Supabase secrets
        if: github.event_name != 'pull_request'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        run: |
          if [ -z "$SUPABASE_URL" ]; then
            echo "::error::SUPABASE_URL is missing; this APK would have no accounts."
            exit 1
          fi

      - name: Copy web assets into the Android project
        working-directory: web
        run: npx cap sync android

      # FCM only accepts a token for the package named in this file, so a build
      # without it has no notifications. Same secret the native app used.
      - name: Write Firebase config
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" | base64 -d > web/android/app/google-services.json
          else
            echo "::warning::No GOOGLE_SERVICES_JSON secret; this APK will not receive push."
          fi

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/chatnook.jks"
          else
            echo "::warning::No KEYSTORE_BASE64 secret; the APK will not install over an existing one."
          fi

      - name: Build release APK
        working-directory: web/android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          chmod +x gradlew
          # GITHUB_RUN_NUMBER restarts at 1 per workflow file, so the prototype's
          # numbers (up to 58) beat this workflow's (7) and Android refused the
          # update as a downgrade. The 1000 offset keeps this workflow above any
          # code the prototype ever shipped.
          VERSION_NAME="${GITHUB_REF_NAME#v}"
          if [ "$GITHUB_REF_TYPE" != "tag" ]; then VERSION_NAME="0.4.${GITHUB_RUN_NUMBER}"; fi
          ./gradlew assembleRelease --no-daemon --stacktrace \
            -PCHATNOOK_KEYSTORE_PATH="$RUNNER_TEMP/chatnook.jks" \
            -PCHATNOOK_KEYSTORE_PASSWORD="$KEYSTORE_PASSWORD" \
            -PCHATNOOK_KEY_ALIAS="$KEY_ALIAS" \
            -PCHATNOOK_KEY_PASSWORD="$KEY_PASSWORD" \
            -PCHATNOOK_VERSION_CODE="$((1000 + ${GITHUB_RUN_NUMBER:-0}))" \
            -PCHATNOOK_VERSION_NAME="$VERSION_NAME"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: chatnook-apk
          path: web/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30

      # The release asset keeps the name friends already download.
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK=web/android/app/build/outputs/apk/release/app-release.apk
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$APK" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "$APK" \
              --title "ChatNook ${GITHUB_REF_NAME#v}" \
              --generate-notes
          fi
