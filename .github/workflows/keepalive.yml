name: Keepalive

# Supabase pauses a free project after a week without activity, which would take the
# whole app down while nobody is chatting. One authenticated query a day keeps it awake.
on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Query the REST API
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          code=$(curl -s -o /tmp/body -w '%{http_code}' \
            -H "apikey: $SUPABASE_ANON_KEY" \
            "$SUPABASE_URL/rest/v1/roles?select=id&limit=1")
          echo "HTTP $code"
          head -c 300 /tmp/body; echo
          test "$code" = "200"
