name: Native prototype build

on:
  workflow_dispatch:
    inputs:
      reason:
        description: Why this build is being produced
        required: false
        default: Manual release build
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'plans/**'
      - 'docs/**'
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'plans/**'
      - 'docs/**'

concurrency:
  group: release-apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'


      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle.kts', 'gradle/libs.versions.toml', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      # The push function's decisions are plain TypeScript; Node strips the types itself.
      - name: Test push rules
        run: node --test supabase/functions/push/rules.test.ts

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      # Both files are gitignored: the repo is public and the keystore is a secret.
      # Missing secrets are tolerated so a fork can still build.
      - name: Write Firebase config
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" | base64 -d > app/google-services.json
          else
            echo "No GOOGLE_SERVICES_JSON secret; building without push support."
          fi

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/chatnook.jks"
          else
            echo "No KEYSTORE_BASE64 secret; the release APK will use the debug key."
          fi

      - name: Run unit tests
        run: ./gradlew :app:testReleaseUnitTest --no-daemon --stacktrace

      - name: Build release APK
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          ./gradlew :app:assembleRelease --no-daemon --stacktrace \
            -PSUPABASE_URL="$SUPABASE_URL" \
            -PSUPABASE_ANON_KEY="$SUPABASE_ANON_KEY" \
            -PCHATNOOK_KEYSTORE_PATH="$RUNNER_TEMP/chatnook.jks" \
            -PCHATNOOK_KEYSTORE_PASSWORD="$KEYSTORE_PASSWORD" \
            -PCHATNOOK_KEY_ALIAS="$KEY_ALIAS" \
            -PCHATNOOK_KEY_PASSWORD="$KEY_PASSWORD"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: chatnook-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30

      # Releases are published from the web client now (release-web-apk.yml); this
      # job stays as the rollback build for the native prototype.
      - name: Upload mapping file
        uses: actions/upload-artifact@v4
        with:
          name: chatnook-mapping
          path: app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: warn
          retention-days: 30
